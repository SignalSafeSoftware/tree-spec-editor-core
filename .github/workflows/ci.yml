name: CI

on:
    push:
        branches: [main, develop]
        tags: ["v*"]
    pull_request:
        branches: [main, develop]
    workflow_dispatch:

permissions:
    contents: read

env:
    PUBLISH_NODE_VERSION: "24"

jobs:
    checks:
        name: Checks (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ["22", "24"]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Enable Yarn
              run: corepack enable

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Lint
              run: yarn lint

            - name: Typecheck
              run: yarn typecheck

            - name: Build
              run: yarn build

    tests:
        name: Tests (Node ${{ matrix.node-version }})
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ["22", "24"]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Enable Yarn
              run: corepack enable

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Test with coverage
              run: yarn test:coverage

            - name: Upload coverage
              if: matrix.node-version == '24'
              uses: actions/upload-artifact@v7
              with:
                  name: coverage
                  path: coverage/lcov.info

    scan:
        name: SonarCloud scan
        needs: tests
        if: |
            github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: write
        env:
            SONAR_TOKEN: ${{ secrets.PACKAGES_SONAR_TOKEN }}
        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.PUBLISH_NODE_VERSION }}

            - name: Enable Yarn
              run: corepack enable

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Test with coverage
              run: yarn test:coverage

            - name: Verify coverage report
              run: |
                  test -f coverage/lcov.info
                  grep '^SF:src/' coverage/lcov.info

            - name: SonarCloud scan
              uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
              env:
                  SONAR_TOKEN: ${{ secrets.PACKAGES_SONAR_TOKEN }}
              with:
                  # This project's SonarCloud GitHub binding returns 404 for
                  # pullrequest lookup. Analyze PRs as branches until the
                  # binding is repaired in SonarCloud.
                  args: ${{ github.event_name == 'pull_request' && format('-Dsonar.branch.name={0} -Dsonar.qualitygate.wait=true', github.head_ref) || '-Dsonar.qualitygate.wait=true' }}

            - name: Sonar PR comment
              if: github.event_name == 'pull_request'
              uses: actions/github-script@v9
              with:
                  script: |
                      const body = `SonarCloud analysis for \`@signalsafe/tree-spec-editor-core\` (\`signalsafe-package-tree-spec-editor-core\`) completed with result \`${{ job.status }}\`.`;
                      await github.rest.issues.createComment({
                          owner: context.repo.owner,
                          repo: context.repo.repo,
                          issue_number: context.issue.number,
                          body,
                      });

    smoke-package:
        name: Smoke package (Node ${{ matrix.node-version }})
        needs: [checks, tests]
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                node-version: ["22", "24"]
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ matrix.node-version }}

            - name: Enable Yarn
              run: corepack enable

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Smoke-test packed artifact
              run: yarn smoke:package

    publish:
        name: Publish
        needs: [checks, tests, scan, smoke-package]
        if: |
            github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
            needs.checks.result == 'success' &&
            needs.tests.result == 'success' &&
            needs.scan.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v7

            - uses: actions/setup-node@v7
              with:
                  node-version: ${{ env.PUBLISH_NODE_VERSION }}

            - name: Enable Yarn
              run: corepack enable

            - name: Install dependencies
              run: yarn install --frozen-lockfile

            - name: Verify artifact before publish
              run: yarn smoke:package

            - name: Check package version
              run: node -e "const p=require('./package.json'); console.log(p.name, p.version)"

            - name: Pack approved artifact
              run: npm pack --ignore-scripts --json > "$RUNNER_TEMP/approved-pack.json"
            - name: Verify exact approved archive and version tag
              id: artifact
              run: |
                  node --input-type=module <<'NODE'
                  import assert from 'node:assert/strict';
                  import { readFileSync, appendFileSync } from 'node:fs';
                  import { createHash } from 'node:crypto';
                  import process from 'node:process';
                  const expected = JSON.parse(readFileSync('release-artifact.json', 'utf8'));
                  const [packed] = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/approved-pack.json`, 'utf8'));
                  assert.equal(packed.name, expected.name);
                  assert.equal(packed.version, expected.version);
                  assert.equal(process.env.GITHUB_REF_NAME, `v${expected.version}`);
                  assert.equal(packed.filename, `${expected.name.slice(1).replace('/', '-')}-${expected.version}.tgz`);
                  assert.equal(createHash('sha256').update(readFileSync(packed.filename)).digest('hex'), expected.sha256);
                  appendFileSync(process.env.GITHUB_OUTPUT, `archive=${packed.filename}\n`);
                  NODE
            - name: Configure npm auth
              run: |
                echo "registry=https://registry.npmjs.org/" > ~/.npmrc
                echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" >> ~/.npmrc
              env:
                NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Verify npm publisher account
              run: npm whoami
              env:
                NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

            - name: Publish to npm
              run: npm publish "${{ steps.artifact.outputs.archive }}" --access public --ignore-scripts
              env:
                NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
